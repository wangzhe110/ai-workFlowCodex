server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # V1 默认允许最大 500 MB 源视频；网关上限应与后端 MAX_UPLOAD_BYTES 保持一致。
    client_max_body_size 550m;

    # 静态资源本身不包含密钥或用户素材。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 反向代理保持 /api/v1/... 原始路径，前端可始终使用相对地址，无需公开 API 容器端口。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # 本机受控媒体由 FastAPI 只读挂载。将它保持为同源路径，生产台可以预览/下载本地
    # MP4 和图片，而不需要浏览器直接知道 API 容器地址或供应商临时 URL。
    location /media/generated/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }

    # SPA 刷新深层路由时仍返回 index.html，而不是 Nginx 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
